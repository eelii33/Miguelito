<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miguelito | Colección</title>
    <!-- Importamos una tipografía moderna estilo editorial (Montserrat / Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #f9f6f0;      /* Tono neutro / beige suave estilo tienda de moda */
        --text-color: #1a1a1a;    /* Texto casi negro muy elegante */
        --accent-color: #8c7355;  /* Tono topo / neutro cálido */
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Montserrat', sans-serif;
        letter-spacing: 0.05em;
        line-height: 1.6;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Cabecera / Estilo Minimalista de Moda */
      header {
        padding: 40px 20px 20px;
        text-align: center;
        border-bottom: 1px solid #e0dbd1;
        margin-bottom: 40px;
      }

      header h1 {
        font-size: 1.8rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 10px;
      }

      header h2 {
        font-size: 0.9rem;
        font-weight: 300;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }

      /* Contenido Principal */
      main {
        flex: 1;
        max-width: 800px;
        margin: 0 auto;
        padding: 0 20px;
        text-align: center;
      }

      main p {
        font-size: 1rem;
        font-weight: 300;
        color: #444;
        margin-bottom: 40px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* Contenedor de Video Estilo Editorial */
      .video-container {
        position: relative;
        width: 100%;
        max-width: 700px;
        margin: 0 auto 60px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        background: #000;
      }

      .video-wrapper {
        position: relative;
        padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
        height: 0;
      }

      .video-wrapper iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }

      /* Pie de página sutil */
      footer {
        text-align: center;
        padding: 20px;
        font-size: 0.75rem;
        color: #888;
        border-top: 1px solid #e0dbd1;
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }
    </style>
  </head>
  <body>

    <header>
      <h1>Hola, mundo</h1>
      <h2>Elizabeth Romero</h2>
    </header>

    <main>
      <p>Este es el contenido visible de la página.</p>

      <!-- Video incrustado -->
      <div class="video-container">
        <div class="video-wrapper">
          <iframe src="https://www.youtube.com/embed/y9Jq17RNWmI" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
      </div>
    </main>

    <footer>
      &copy; 2026 Miguelito. Todos los derechos reservados.
    </i>

  </body>
</html>
